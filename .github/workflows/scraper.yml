name: Daily Festival Scraper & Update

on:
  schedule:
    # Führt den Workflow täglich um 04:00 Uhr UTC aus
    - cron: '0 4 * * *'
  workflow_dispatch: # Erlaubt auch das manuelle Starten über den "Run workflow"-Button in GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper ausführen
        run: |
          # ERSETZE 'scraper.py' DURCH DEN NAMEN DEINES EIGENEN SCRAPER-SKRIPTS:
          python scraper.py

      - name: Änderungen prüfen und committen (festivals.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Prüfen, ob sich die festivals.json geändert hat
          if [ -n "$(git status --porcelain festivals.json)" ]; then
            echo "Änderungen in festivals.json gefunden. Committe Daten..."
            git add festivals.json
            git commit -m "🤖 Automatische Aktualisierung der Festivaldaten ($(date +'%Y-%m-%d'))"
            git push
          else
            echo "Keine Änderungen in festivals.json vorhanden. Kein Commit nötig."
          fi
