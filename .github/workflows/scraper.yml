name: Daily Festival Scraper

on:
  schedule:
    # Täglich um 03:00 Uhr UTC (05:00 Uhr deutscher Sommerzeit)
    - cron: '0 3 * * *'
  # Erlaubt es dir, den Scraper jederzeit manuell über GitHub zu starten
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python-Umgebung einrichten
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Benötigte Bibliotheken installieren (geopy ergänzt!)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 geopy

      # 4. Scraper-Skript ausführen (Dateiname auf scraper.py korrigiert)
      - name: Run Festival Scraper
        run: |
          python scraper.py

      # 5. Geänderte festivals.json & plz_cache.json zurück in GitHub committen und pushen
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add festivals.json plz_cache.json
          
          # Prüfen, ob sich Dateien verändert haben
          if git diff --staged --quiet; then
            echo "Keine Änderungen in den Daten gefunden."
          else
            git commit -m "auto: Daily update of festivals.json and plz_cache.json"
            git push
          fi
