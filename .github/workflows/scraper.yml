name: Daily Festival Scraper

on:
  schedule:
    # Führt das Skript jeden Tag um 03:00 Uhr UTC aus
    - cron: '0 3 * * *'
  # Erlaubt das manuelle Starten über den GitHub-Tab "Actions"
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper ausführen
        run: |
          python scraper.py

      - name: Aktualisierte Daten committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add festivals.json plz_cache.json
          
          # Nur committen, wenn sich die Dateien tatsächlich verändert haben
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automatische Aktualisierung der Festival-Daten" && git push)
