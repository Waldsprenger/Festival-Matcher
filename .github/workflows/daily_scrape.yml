name: Daily Festival Scraper

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    # NEU: Schreibrechte explizit gewähren
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Scraper
      run: python festival_scraper.py

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add festivals_data.json festivals_data.csv
        git diff-index --quiet HEAD || git commit -m "Auto-update festival data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        git push
