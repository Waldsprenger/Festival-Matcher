name: Daily Festival Scraper

on:
  schedule:
    # Führt das Skript jeden Tag um 04:00 Uhr UTC aus
    - cron: '0 4 * * *'
  workflow_dispatch: # Erlaubt auch manuelles Starten über GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Run Scraper
      run: python festival_scraper.py

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add festivals_data.json
        git diff-index --quiet HEAD || git commit -m "Auto-update festival data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        git push